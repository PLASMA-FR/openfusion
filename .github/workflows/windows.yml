# SPDX-License-Identifier: LGPL-2.1-or-later

name: OpenFusion Windows locked-Pixi baseline

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Windows x64 Release (Conda compiler)
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    env:
      TZ: UTC

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Verify runner and exact submodule checkout
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force logs | Out-Null

          if ($env:RUNNER_ARCH -ne "X64") {
            throw "Expected an X64 runner, got '$env:RUNNER_ARCH'."
          }

          git submodule sync --recursive 2>&1 | Tee-Object -FilePath logs/submodule-sync.log
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed." }

          git submodule update --init --recursive 2>&1 | Tee-Object -FilePath logs/submodule-update.log
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed." }

          $status = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0) { throw "git submodule status failed." }
          $status | Set-Content -Encoding utf8 logs/submodules.txt

          $invalid = @($status | Where-Object { $_ -match '^[-+U]' })
          if ($invalid.Count -ne 0) {
            $invalid | ForEach-Object { Write-Error "Invalid submodule state: $_" }
            throw "A submodule is missing, conflicted, or not at its recorded commit."
          }

          "runner_os=$env:RUNNER_OS" | Set-Content -Encoding utf8 logs/runner.txt
          "runner_arch=$env:RUNNER_ARCH" | Add-Content -Encoding utf8 logs/runner.txt
          "image_os=$env:ImageOS" | Add-Content -Encoding utf8 logs/runner.txt
          "image_version=$env:ImageVersion" | Add-Content -Encoding utf8 logs/runner.txt
          "os_version=$([Environment]::OSVersion.VersionString)" |
            Add-Content -Encoding utf8 logs/runner.txt
          $PSVersionTable | Out-String | Set-Content -Encoding utf8 logs/powershell.txt

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false
          run-install: false

      - name: Materialize locked build environment
        timeout-minutes: 45
        env:
          EXPECTED_PIXI_PLATFORM: win-64
        run: |
          $ErrorActionPreference = "Stop"
          pixi --version 2>&1 | Tee-Object -FilePath logs/pixi-version.txt
          if ($LASTEXITCODE -ne 0) { throw "pixi --version failed." }

          Get-FileHash -Algorithm SHA256 pixi.lock |
            Format-List | Out-File -Encoding utf8 logs/pixi-lock.sha256

          pixi info 2>&1 | Tee-Object -FilePath logs/pixi-info.log
          if ($LASTEXITCODE -ne 0) { throw "pixi info failed." }
          $platformLines = @(
            Select-String -Path logs/pixi-info.log -Pattern '^\s*Platform:\s*(\S+)\s*$'
          )
          if ($platformLines.Count -ne 1) {
            throw "Expected exactly one active Platform field from pixi info."
          }
          $activePlatform = $platformLines[0].Matches[0].Groups[1].Value
          if ($activePlatform -ne $env:EXPECTED_PIXI_PLATFORM) {
            throw "Expected Pixi platform '$env:EXPECTED_PIXI_PLATFORM', got '$activePlatform'."
          }
          $activePlatform | Set-Content -Encoding ascii logs/pixi-platform.txt

          pixi install --locked 2>&1 | Tee-Object -FilePath logs/pixi-install.log
          if ($LASTEXITCODE -ne 0) { throw "pixi install --locked failed." }

      - name: Configure Release build with tests
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          pixi run configure-release 2>&1 | Tee-Object -FilePath logs/configure.log
          if ($LASTEXITCODE -ne 0) { throw "Release configuration failed." }

          $cache = (Get-Content -Raw build/release/CMakeCache.txt).Replace("`r`n", "`n")
          $required = @(
            '^CMAKE_BUILD_TYPE:STRING=Release$',
            '^ENABLE_DEVELOPER_TESTS:BOOL=(ON|TRUE)$',
            '^BUILD_TEST:BOOL=(ON|TRUE)$',
            '^BUILD_GUI:BOOL=(ON|TRUE)$',
            '^BUILD_IMPORT:BOOL=(ON|TRUE)$',
            '^BUILD_MATERIAL:BOOL=(ON|TRUE)$',
            '^BUILD_DRAFT:BOOL=(ON|TRUE)$',
            '^BUILD_FEM:BOOL=(ON|TRUE)$',
            '^BUILD_MEASURE:BOOL=(ON|TRUE)$',
            '^BUILD_MESH:BOOL=(ON|TRUE)$',
            '^BUILD_MESH_PART:BOOL=(ON|TRUE)$',
            '^BUILD_SPREADSHEET:BOOL=(ON|TRUE)$',
            '^BUILD_SURFACE:BOOL=(ON|TRUE)$',
            '^BUILD_PART:BOOL=(ON|TRUE)$',
            '^BUILD_PART_DESIGN:BOOL=(ON|TRUE)$',
            '^BUILD_SKETCHER:BOOL=(ON|TRUE)$',
            '^BUILD_ASSEMBLY:BOOL=(ON|TRUE)$',
            '^BUILD_CAM:BOOL=(ON|TRUE)$',
            '^BUILD_TECHDRAW:BOOL=(ON|TRUE)$'
          )
          foreach ($pattern in $required) {
            if ($cache -notmatch "(?m)$pattern") {
              throw "Required CMake cache entry did not match: $pattern"
            }
          }

      - name: Build Release
        timeout-minutes: 240
        run: |
          $ErrorActionPreference = "Stop"
          pixi run build-release 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }

      - name: Verify native outputs and record Conda compiler
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PeMachine([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            $reader = $null
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "Missing DOS header in '$Path'."
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0 -or ($peOffset + 6) -gt $stream.Length) {
                throw "Invalid PE header offset in '$Path'."
              }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Missing PE signature in '$Path'."
              }
              return $reader.ReadUInt16()
            }
            finally {
              if ($null -ne $reader) { $reader.Dispose() }
              else { $stream.Dispose() }
            }
          }

          $architecture = @()
          foreach ($relativePath in @(
            "build/release/bin/FreeCADCmd.exe",
            "build/release/bin/FreeCAD.exe"
          )) {
            $binary = Join-Path $PWD $relativePath
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Expected native binary not found: $binary"
            }
            $machine = Get-PeMachine $binary
            $machineHex = "0x{0:X4}" -f $machine
            $architecture += "$relativePath machine=$machineHex"
            if ($machine -ne 0x8664) {
              throw "Expected x86-64 PE machine 0x8664 for '$binary', got $machineHex."
            }
          }
          $architecture | Set-Content -Encoding ascii logs/binary-architectures.txt

          $compilerFiles = @(
            Get-ChildItem build/release/CMakeFiles -Recurse -Filter CMakeCXXCompiler.cmake
          )
          if ($compilerFiles.Count -eq 0) {
            throw "CMake C++ compiler diagnostics were not generated."
          }
          $compilerFile = $compilerFiles[0]
          $compilerText = (Get-Content -Raw $compilerFile.FullName).Replace("`r`n", "`n")
          foreach ($pattern in @(
            '^set\(CMAKE_CXX_COMPILER ".+"\)$',
            '^set\(CMAKE_CXX_COMPILER_ID ".+"\)$',
            '^set\(CMAKE_CXX_COMPILER_VERSION ".+"\)$'
          )) {
            if ($compilerText -notmatch "(?m)$pattern") {
              throw "Missing compiler diagnostic matching: $pattern"
            }
          }
          Copy-Item -LiteralPath $compilerFile.FullName logs/CMakeCXXCompiler.cmake
          $compilerSummary = @(
            ($compilerText -split "`r?`n") |
              Where-Object { $_ -match '^set\(CMAKE_CXX_COMPILER(_ID|_VERSION)? ' }
          )
          $compilerSummary | Set-Content -Encoding utf8 logs/compiler-summary.txt

          pixi run cmake --version 2>&1 | Tee-Object -FilePath logs/cmake-version.txt
          if ($LASTEXITCODE -ne 0) { throw "CMake version probe failed." }
          pixi run ninja --version 2>&1 | Tee-Object -FilePath logs/ninja-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Ninja version probe failed." }

      - name: Verify CTest-native test runtime discovery
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          $moduleRoot = (Resolve-Path -LiteralPath build/release/Mod).Path
          $moduleRoot = $moduleRoot.TrimEnd([char[]]@('\', '/'))
          $modulePrefix = $moduleRoot + [IO.Path]::DirectorySeparatorChar
          $preconfiguredModulePaths = @(
            $env:PATH -split [IO.Path]::PathSeparator |
              ForEach-Object {
                if (-not [string]::IsNullOrWhiteSpace($_)) {
                  try {
                    [IO.Path]::GetFullPath($_).TrimEnd([char[]]@('\', '/'))
                  } catch {}
                }
              } |
              Where-Object {
                $_ -ieq $moduleRoot -or
                  $_.StartsWith(
                    $modulePrefix,
                    [StringComparison]::OrdinalIgnoreCase
                  )
              }
          )
          if ($preconfiguredModulePaths.Count -ne 0) {
            throw (
              "Build-tree module directories were already present on PATH " +
              "before the native CTest probe: " +
              ($preconfiguredModulePaths -join ", ")
            )
          }

          $discovery = @(
            pixi run ctest --test-dir build/release --show-only=json-v1
          )
          if ($LASTEXITCODE -ne 0) {
            throw "CTest-native GoogleTest discovery failed."
          }
          $discovery | Set-Content -Encoding utf8 `
            logs/ctest-native-runtime-discovery.json

          $report = Get-Content -Raw `
            logs/ctest-native-runtime-discovery.json | ConvertFrom-Json
          if ($report.tests -isnot [System.Array]) {
            throw "CTest-native discovery JSON did not contain a tests array."
          }
          $materialTests = @(
            $report.tests | Where-Object {
              (@($_.command) -join " ") -match `
                '(?i)Material_tests_run(?:\.exe)?'
            }
          )
          if ($materialTests.Count -eq 0) {
            throw "CTest-native discovery did not register Material tests."
          }

          $manifest = Join-Path $PWD `
            "build/release/tests/windows-native-test-runtime-paths.txt"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "CTest-native runtime manifest was not generated: $manifest"
          }
          $manifestPaths = @(
            Get-Content -LiteralPath $manifest |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object {
                [IO.Path]::GetFullPath($_).TrimEnd([char[]]@('\', '/'))
              }
          )
          $binaryRoot = (Resolve-Path -LiteralPath build/release/bin).Path
          $binaryRoot = $binaryRoot.TrimEnd([char[]]@('\', '/'))
          $materialRoot = (
            Resolve-Path -LiteralPath build/release/Mod/Material
          ).Path.TrimEnd([char[]]@('\', '/'))
          if ($manifestPaths -notcontains $binaryRoot) {
            throw "CTest-native runtime manifest omitted the build bin directory."
          }
          if ($manifestPaths -notcontains $materialRoot) {
            throw "CTest-native runtime manifest omitted the Material directory."
          }

          $qtPluginManifest = Join-Path $PWD `
            "build/release/tests/windows-native-test-qt-plugin-paths.txt"
          if (-not (Test-Path -LiteralPath $qtPluginManifest -PathType Leaf)) {
            throw "CTest-native Qt plugin manifest was not generated: $qtPluginManifest"
          }
          $qtPluginPaths = @(
            Get-Content -LiteralPath $qtPluginManifest |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object {
                [IO.Path]::GetFullPath($_).TrimEnd([char[]]@('\', '/'))
              }
          )
          if ($qtPluginPaths.Count -ne 2) {
            throw "CTest-native Qt plugin manifest must contain exactly two paths."
          }
          $qtPluginRoot = $qtPluginPaths[0]
          $qtPlatformRoot = $qtPluginPaths[1]
          $expectedPlatformRoot = [IO.Path]::GetFullPath(
            (Join-Path $qtPluginRoot "platforms")
          ).TrimEnd([char[]]@('\', '/'))
          if (-not $qtPlatformRoot.Equals(
              $expectedPlatformRoot,
              [StringComparison]::OrdinalIgnoreCase
          )) {
            throw (
              "Qt platform plugin path is not below the queried plugin root: " +
              "$qtPlatformRoot"
            )
          }
          foreach ($platformPlugin in @("qwindows*.dll", "qoffscreen*.dll")) {
            $matches = @(
              Get-ChildItem -LiteralPath $qtPlatformRoot -Filter $platformPlugin `
                -File
            )
            if ($matches.Count -eq 0) {
              throw "CTest-native Qt plugin path omitted $platformPlugin."
            }
          }

          Copy-Item -LiteralPath $manifest `
            logs/ctest-native-runtime-paths.txt
          Copy-Item -LiteralPath $qtPluginManifest `
            logs/ctest-native-qt-plugin-paths.txt
          @(
            "discovered_tests=$(@($report.tests).Count)",
            "material_tests=$($materialTests.Count)",
            "runtime_directories=$($manifestPaths.Count)",
            "qt_plugin_root=$qtPluginRoot",
            "qt_platform_plugin_root=$qtPlatformRoot"
          ) | Set-Content -Encoding ascii `
            logs/ctest-native-runtime-summary.txt

      - name: Register native test runtime and Qt plugin directories
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          pixi run python tests/ci/test_windows_test_runtime.py 2>&1 |
            Tee-Object -FilePath logs/windows-test-runtime-unit.log
          if ($LASTEXITCODE -ne 0) {
            throw "Windows test runtime helper unit tests failed."
          }

          pixi run python .github/scripts/prepare_windows_test_runtime.py `
            --build-dir build/release `
            --github-path "$env:GITHUB_PATH" `
            --github-env "$env:GITHUB_ENV" `
            --manifest logs/windows-test-runtime-paths.txt `
            --qt-plugin-manifest build/release/tests/windows-native-test-qt-plugin-paths.txt `
            --lock-file pixi.lock `
            --stage-software-opengl `
            --require-artifact Materials.pyd `
            2>&1 | Tee-Object -FilePath logs/windows-test-runtime-setup.log
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native test runtime setup failed."
          }

      - name: Discover CTest tests
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $discovery = @(pixi run ctest --test-dir build/release --show-only=json-v1)
          if ($LASTEXITCODE -ne 0) { throw "CTest discovery failed." }
          $discovery | Set-Content -Encoding utf8 logs/ctest-discovery.json

          $report = Get-Content -Raw logs/ctest-discovery.json | ConvertFrom-Json
          if ($report.tests -isnot [System.Array]) {
            throw "CTest JSON did not contain a tests array."
          }
          $count = @($report.tests).Count
          $testNames = @($report.tests | ForEach-Object { $_.name })
          $requiredAcceptance = @(
            "OpenFusion_Assembly_Acceptance",
            "OpenFusion_Core_Acceptance",
            "OpenFusion_GUI_SystemExit_Propagation",
            "OpenFusion_TechDraw_Acceptance"
          )
          $missingAcceptance = @(
            $requiredAcceptance | Where-Object { $testNames -notcontains $_ }
          )
          if ($missingAcceptance.Count -ne 0) {
            throw "Acceptance tests were not registered with CTest: $($missingAcceptance -join ', ')"
          }
          "$count" | Set-Content -Encoding ascii logs/ctest-count.txt
          Write-Host "Discovered $count CTest tests"
          if ($count -eq 0) { throw "CTest discovered zero tests." }

      - name: Run CTest baseline
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = "Stop"
          pixi run ctest `
            --test-dir build/release `
            --output-on-failure `
            --no-tests=error `
            --parallel 2 `
            --timeout 600 `
            2>&1 | Tee-Object -FilePath logs/ctest.log
          if ($LASTEXITCODE -ne 0) { throw "CTest baseline failed." }

      - name: Verify loaded Windows software OpenGL runtime
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $outputDir = Join-Path $PWD "build/release/Testing/OpenFusionAcceptance"
          $profileDir = Join-Path $env:RUNNER_TEMP `
            "openfusion-opengl-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $applicationLog = Join-Path $outputDir "FreeCADGui-windows-opengl.log"
          $stdoutLog = Join-Path $PWD "logs/windows-opengl-runtime.log"
          $report = Join-Path $outputDir "WindowsOpenGLRuntime.json"
          $binary = Join-Path $PWD "build/release/bin/FreeCAD.exe"
          New-Item -ItemType Directory -Force $outputDir, $profileDir | Out-Null

          $env:OPENFUSION_ACCEPTANCE_OUTPUT_DIR = $outputDir
          $env:QT_QPA_PLATFORM = "windows"
          pixi run $binary `
            --safe-mode `
            --user-cfg (Join-Path $profileDir "user.cfg") `
            --system-cfg (Join-Path $profileDir "system.cfg") `
            --log-file $applicationLog `
            --python-path (Join-Path $PWD "tests/acceptance") `
            --run-test OpenFusionWindowsOpenGLAcceptance `
            2>&1 | Tee-Object -FilePath $stdoutLog
          $runtimeExitCode = $LASTEXITCODE

          $graphicsExitCode = $null
          if (Test-Path -LiteralPath $applicationLog -PathType Leaf) {
            pixi run python .github/scripts/validate_gui_graphics_log.py `
              $applicationLog `
              --label "Windows OpenGL runtime"
            $graphicsExitCode = $LASTEXITCODE
          }
          if ($runtimeExitCode -ne 0) {
            throw "Windows OpenGL runtime acceptance failed with exit code $runtimeExitCode."
          }
          if ($null -eq $graphicsExitCode -or $graphicsExitCode -ne 0) {
            throw "Windows OpenGL runtime graphics validation failed or had no log."
          }
          if (-not (Test-Path -LiteralPath $report -PathType Leaf) -or
              (Get-Item -LiteralPath $report).Length -eq 0) {
            throw "Windows OpenGL runtime evidence was missing or empty."
          }

      - name: Validate TechDraw GUI SVG and PDF export
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $outputDir = Join-Path $PWD "build/release/Testing/OpenFusionAcceptance"
          $profileDir = Join-Path $env:RUNNER_TEMP `
            "openfusion-techdraw-gui-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $applicationLog = Join-Path $outputDir "FreeCADGui-techdraw-export.log"
          $stdoutLog = Join-Path $PWD "logs/techdraw-gui-export.log"
          $binary = Join-Path $PWD "build/release/bin/FreeCAD.exe"
          $fixture = Join-Path $outputDir "OpenFusionTechDrawAcceptance.FCStd"
          New-Item -ItemType Directory -Force $outputDir, $profileDir | Out-Null
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) {
            throw "Missing TechDraw fixture: $fixture"
          }

          $env:OPENFUSION_ACCEPTANCE_OUTPUT_DIR = $outputDir
          $env:QT_QPA_PLATFORM = "windows"
          $arguments = @(
            "--safe-mode",
            "--user-cfg", (Join-Path $profileDir "user.cfg"),
            "--system-cfg", (Join-Path $profileDir "system.cfg"),
            "--log-file", $applicationLog,
            "--python-path", (Join-Path $PWD "tests/acceptance"),
            "--run-test", "OpenFusionTechDrawGuiExportAcceptance"
          )
          pixi run $binary @arguments 2>&1 | Tee-Object -FilePath $stdoutLog
          $techDrawExitCode = $LASTEXITCODE

          $graphicsExitCode = $null
          if (Test-Path -LiteralPath $applicationLog -PathType Leaf) {
            pixi run python .github/scripts/validate_gui_graphics_log.py `
              $applicationLog `
              --label "TechDraw GUI export"
            $graphicsExitCode = $LASTEXITCODE
          }

          $requiredFiles = @(
            $applicationLog,
            (Join-Path $outputDir "TechDrawGuiExport/OpenFusionTechDraw-full-page.svg"),
            (Join-Path $outputDir "TechDrawGuiExport/OpenFusionTechDraw-full-page.pdf")
          )
          $missingFiles = @()
          foreach ($path in $requiredFiles) {
            if (
              -not (Test-Path -LiteralPath $path -PathType Leaf) -or
              (Get-Item -LiteralPath $path).Length -eq 0
            ) {
              $missingFiles += $path
            }
          }
          if ($techDrawExitCode -ne 0) {
            throw "TechDraw GUI export acceptance failed with exit code $techDrawExitCode."
          }
          if ($null -eq $graphicsExitCode -or $graphicsExitCode -ne 0) {
            throw "TechDraw GUI export graphics validation failed or had no log."
          }
          if ($missingFiles.Count -ne 0) {
            throw "Missing or empty TechDraw GUI export artifacts: $($missingFiles -join ', ')"
          }

          pixi run python .github/scripts/validate_unittest_summary.py `
            $stdoutLog `
            --expected-count 1 `
            --label "TechDraw GUI export"
          if ($LASTEXITCODE -ne 0) {
            throw "TechDraw GUI export summary validation failed."
          }

      - name: Upload TechDraw GUI export diagnostics
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: techdraw-gui-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/techdraw-gui-export.log
            build/release/Testing/OpenFusionAcceptance/FreeCADGui-techdraw-export.log
            build/release/Testing/OpenFusionAcceptance/TechDrawGuiExport/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Run native FreeCADCmd baseline
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $PWD "build/release/bin/FreeCADCmd.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected CLI binary not found: $binary"
          }

          $profile = Join-Path $env:RUNNER_TEMP "openfusion-cli-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $profile | Out-Null
          $userCfg = Join-Path $profile "user.cfg"
          $systemCfg = Join-Path $profile "system.cfg"
          $applicationLog = Join-Path $profile "freecad-cli.log"

          pixi run $binary `
            --safe-mode `
            --user-cfg $userCfg `
            --system-cfg $systemCfg `
            --version --verbose `
            2>&1 |
            Tee-Object -FilePath logs/freecadcmd-version.log
          if ($LASTEXITCODE -ne 0) { throw "FreeCADCmd version probe failed." }

          pixi run $binary `
            --safe-mode `
            --user-cfg $userCfg `
            --system-cfg $systemCfg `
            --dump-config `
            2>&1 |
            Tee-Object -FilePath logs/freecadcmd-config.log
          if ($LASTEXITCODE -ne 0) { throw "FreeCADCmd configuration probe failed." }

          $inventoryProfile = Join-Path $env:RUNNER_TEMP "openfusion-cli-inventory-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $inventoryProfile | Out-Null
          $inventoryLog = Join-Path $inventoryProfile "freecad-cli-inventory.log"
          pixi run $binary `
            --safe-mode `
            --user-cfg (Join-Path $inventoryProfile "user.cfg") `
            --system-cfg (Join-Path $inventoryProfile "system.cfg") `
            --log-file $inventoryLog `
            -t `
            2>&1 | Tee-Object -FilePath logs/freecadcmd-test-inventory.log
          if ($LASTEXITCODE -ne 0) { throw "FreeCADCmd test inventory failed." }
          if (
            -not (Test-Path -LiteralPath $inventoryLog -PathType Leaf) -or
            (Get-Item -LiteralPath $inventoryLog).Length -eq 0
          ) {
            throw "FreeCADCmd inventory did not produce a nonempty application log."
          }
          Copy-Item -LiteralPath $inventoryLog logs/freecadcmd-inventory-application.log
          $inventory = Get-Content -Raw logs/freecadcmd-test-inventory.log
          $requiredUnits = @(
            'Document',
            'MeshTestsApp',
            'TestAssemblyWorkbench',
            'TestCAMApp',
            'TestFemApp',
            'TestMaterialsApp',
            'TestPartApp',
            'TestPartDesignApp',
            'TestSketcherApp',
            'TestSpreadsheet',
            'TestSurfaceApp',
            'TestTechDrawApp',
            'UnicodeTests'
          )
          $missingUnits = @(
            $requiredUnits | Where-Object {
              $inventory -notmatch "(?m)^$([regex]::Escape($_))[ \t]*\r?$"
            }
          )
          if ($missingUnits.Count -ne 0) {
            throw "Required CLI test units were not registered: $($missingUnits -join ', ')"
          }
          $requiredUnits | Set-Content -Encoding ascii logs/freecadcmd-required-units.txt

          pixi run $binary `
            --safe-mode `
            --user-cfg $userCfg `
            --system-cfg $systemCfg `
            --log-file $applicationLog `
            -t 0 `
            2>&1 | Tee-Object -FilePath logs/freecadcmd-tests.log
          $testExitCode = $LASTEXITCODE
          if (
            -not (Test-Path -LiteralPath $applicationLog -PathType Leaf) -or
            (Get-Item -LiteralPath $applicationLog).Length -eq 0
          ) {
            throw "FreeCADCmd did not produce a nonempty application log."
          }
          Copy-Item -LiteralPath $applicationLog logs/freecadcmd-application.log
          if ($testExitCode -ne 0) { throw "FreeCADCmd test baseline failed." }

          pixi run python .github/scripts/validate_unittest_summary.py `
            logs/freecadcmd-tests.log `
            --count-file logs/freecadcmd-test-count.txt `
            --label FreeCADCmd
          if ($LASTEXITCODE -ne 0) {
            throw "FreeCADCmd summary validation failed."
          }

      - name: Inventory and run native FreeCAD GUI baseline
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $PWD "build/release/bin/FreeCAD.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected GUI binary not found: $binary"
          }

          $inventoryProfile = Join-Path $env:RUNNER_TEMP "openfusion-gui-inventory-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $inventoryProfile | Out-Null
          $inventoryUserCfg = Join-Path $inventoryProfile "user.cfg"
          $inventorySystemCfg = Join-Path $inventoryProfile "system.cfg"
          $inventoryApplicationLog = Join-Path $inventoryProfile "freecad-gui-inventory.log"

          pixi run $binary `
            --safe-mode `
            --user-cfg $inventoryUserCfg `
            --system-cfg $inventorySystemCfg `
            --log-file $inventoryApplicationLog `
            -t `
            2>&1 | Tee-Object -FilePath logs/freecadgui-inventory.log
          $inventoryExitCode = $LASTEXITCODE

          $inventoryGraphicsExitCode = $null
          if (Test-Path -LiteralPath $inventoryApplicationLog -PathType Leaf) {
            pixi run python .github/scripts/validate_gui_graphics_log.py `
              $inventoryApplicationLog `
              --label "FreeCAD GUI inventory"
            $inventoryGraphicsExitCode = $LASTEXITCODE
            Copy-Item -LiteralPath $inventoryApplicationLog `
              logs/freecadgui-inventory-application.log
          }
          if ($inventoryExitCode -ne 0) { throw "FreeCAD GUI test inventory failed." }
          if (
            -not (Test-Path -LiteralPath $inventoryApplicationLog -PathType Leaf) -or
            (Get-Item -LiteralPath $inventoryApplicationLog).Length -eq 0
          ) {
            throw "FreeCAD GUI inventory did not produce a nonempty application log."
          }
          if ($null -eq $inventoryGraphicsExitCode -or $inventoryGraphicsExitCode -ne 0) {
            throw "FreeCAD GUI inventory graphics validation failed or had no log."
          }
          $inventory = Get-Content -Raw logs/freecadgui-inventory.log
          if ($inventory -notmatch '(?m)^Registered test units:[ \t]*\r?$') {
            throw "FreeCAD GUI inventory did not report registered test units."
          }
          $requiredUnits = @(
            "GuiDocument",
            "Menu",
            "TestAssemblyWorkbench",
            "TestCAMGui",
            "TestDraftGui",
            "TestImportGui",
            "TestMaterialsGui",
            "TestPartGui",
            "TestPartDesignGui",
            "TestSketcherGui",
            "TestTechDrawGui",
            "Workbench"
          )
          $missingUnits = @(
            $requiredUnits | Where-Object {
              $inventory -notmatch "(?m)^$([regex]::Escape($_))[ \t]*\r?$"
            }
          )
          if ($missingUnits.Count -ne 0) {
            throw "Required GUI test units were not registered: $($missingUnits -join ', ')"
          }
          $requiredUnits | Sort-Object |
            Set-Content -Encoding utf8 logs/freecadgui-required-units.txt

          $profile = Join-Path $env:RUNNER_TEMP "openfusion-gui-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $profile | Out-Null
          $userCfg = Join-Path $profile "user.cfg"
          $systemCfg = Join-Path $profile "system.cfg"
          $applicationLog = Join-Path $profile "freecad-gui.log"

          pixi run $binary `
            --safe-mode `
            --user-cfg $userCfg `
            --system-cfg $systemCfg `
            --log-file $applicationLog `
            -t 0 `
            2>&1 | Tee-Object -FilePath logs/freecadgui-tests.log
          $testExitCode = $LASTEXITCODE

          $graphicsExitCode = $null
          if (Test-Path -LiteralPath $applicationLog -PathType Leaf) {
            pixi run python .github/scripts/validate_gui_graphics_log.py `
              $applicationLog `
              --label "FreeCAD GUI"
            $graphicsExitCode = $LASTEXITCODE
            Copy-Item -LiteralPath $applicationLog logs/freecadgui-application.log
          }
          if ($testExitCode -ne 0) { throw "FreeCAD GUI test baseline failed." }
          if (
            -not (Test-Path -LiteralPath $applicationLog -PathType Leaf) -or
            (Get-Item -LiteralPath $applicationLog).Length -eq 0
          ) {
            throw "FreeCAD GUI tests did not produce a nonempty application log."
          }
          if ($null -eq $graphicsExitCode -or $graphicsExitCode -ne 0) {
            throw "FreeCAD GUI graphics validation failed or had no log."
          }
          pixi run python .github/scripts/validate_unittest_summary.py `
            logs/freecadgui-tests.log `
            --count-file logs/freecadgui-test-count.txt `
            --label "FreeCAD GUI"
          if ($LASTEXITCODE -ne 0) {
            throw "FreeCAD GUI summary validation failed."
          }

      - name: Build and verify unsigned Windows portable package
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = "Stop"
          $revision = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "Git returned an invalid source revision: '$revision'."
          }
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($epoch -notmatch '^[0-9]+$') {
            throw "Git returned an invalid source timestamp: '$epoch'."
          }
          $version = "1.1.3-dev.$($revision.Substring(0, 12))"
          $condaPrefix = (Resolve-Path -LiteralPath ".pixi/envs/default").Path
          $packageCache = Join-Path $env:RUNNER_TEMP `
            "openfusion-conda-archives-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $installRoot = Join-Path $env:RUNNER_TEMP `
            "openfusion-windows-install-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $extractRoot = Join-Path $env:RUNNER_TEMP `
            "openfusion-windows-extract-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item -LiteralPath $installRoot, $extractRoot, $packageCache -Recurse -Force `
            -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null

          pixi run python packaging/windows/create_portable_bundle.py fetch-cache `
            --lock-file pixi.lock `
            --package-cache $packageCache `
            2>&1 | Tee-Object -FilePath logs/windows-portable-package-cache.log
          if ($LASTEXITCODE -ne 0) { throw "Locked Conda archive prefetch failed." }

          pixi run cmake --install build/release --prefix $installRoot `
            2>&1 | Tee-Object -FilePath logs/windows-portable-install.log
          if ($LASTEXITCODE -ne 0) { throw "Windows portable install staging failed." }

          pixi run python packaging/windows/create_portable_bundle.py create `
            --install-root $installRoot `
            --conda-prefix $condaPrefix `
            --qt-plugin-manifest build/release/tests/windows-native-test-qt-plugin-paths.txt `
            --lock-file pixi.lock `
            --package-cache $packageCache `
            --license-file COPYING `
            --notice-file NOTICE.md `
            --output-dir artifacts/windows `
            --version $version `
            --source-revision $revision `
            --source-date-epoch $epoch `
            2>&1 | Tee-Object -FilePath logs/windows-portable-create.log
          if ($LASTEXITCODE -ne 0) { throw "Windows portable package creation failed." }

          $archive = Join-Path $PWD `
            "artifacts/windows/OpenFusion-$version-Windows-x86_64-unsigned.zip"
          $manifest = "$archive.manifest.json"
          $checksum = "$archive.sha256"
          $lockSha256 = (Get-FileHash -Algorithm SHA256 pixi.lock).Hash.ToLowerInvariant()
          pixi run python packaging/windows/create_portable_bundle.py verify `
            --archive $archive `
            --manifest $manifest `
            --checksum $checksum `
            --expected-version $version `
            --expected-source-revision $revision `
            --expected-lock-sha256 $lockSha256 `
            2>&1 | Tee-Object -FilePath logs/windows-portable-verify.log
          if ($LASTEXITCODE -ne 0) { throw "Windows portable package verification failed." }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $packageRoot = Join-Path $extractRoot "OpenFusion-$version-Windows-x86_64"
          $packagedCli = Join-Path $packageRoot "OpenFusionCmd.cmd"
          $packagedGui = Join-Path $packageRoot "OpenFusion.cmd"
          $packagedPython = Join-Path $packageRoot "OpenFusionPython.cmd"
          foreach ($launcher in @($packagedCli, $packagedGui, $packagedPython)) {
            if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
              throw "Extracted portable package omitted launcher: $launcher"
            }
          }
          $env:CONDA_PREFIX = $null
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          $env:QT_PLUGIN_PATH = $null
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = $null
          $env:QT_OPENGL = $null
          $env:OPENSSL_CONF = $null
          $env:SSL_CERT_FILE = $null
          $env:OPENSSL_MODULES = $null
          $env:OPENFUSION_PORTABLE_ROOT = $null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $identity = @(& $packagedCli --safe-mode --version 2>&1)
          $identity | Set-Content -Encoding utf8 logs/windows-portable-identity.log
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted OpenFusionCmd.exe failed with exit code $LASTEXITCODE."
          }
          $firstLine = @($identity | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })[0]
          if ($firstLine -notmatch '^OpenFusion\b') {
            throw "Packaged command identity is not canonical OpenFusion: '$firstLine'."
          }

          $pythonProbe = @'
          import _ssl
          import os
          from pathlib import Path
          import ssl
          import sys
          from PySide6 import QtCore, QtWidgets
          root = Path(os.environ["OPENFUSION_PORTABLE_ROOT"]).resolve()
          for value, label in ((sys.executable, "python"), (_ssl.__file__, "_ssl"), (QtCore.__file__, "QtCore")):
              resolved = Path(value).resolve()
              if not resolved.is_relative_to(root):
                  raise RuntimeError(f"{label} escaped package: {resolved}")
          if Path(os.environ["OPENSSL_CONF"]).resolve() != root / "ssl" / "openssl.cnf":
              raise RuntimeError("OpenSSL configuration is not package-relative")
          ssl.create_default_context()
          application = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
          widget = QtWidgets.QWidget()
          widget.show()
          application.processEvents()
          if root / "plugins" not in [Path(value).resolve() for value in QtCore.QCoreApplication.libraryPaths()]:
              raise RuntimeError("Qt did not load the package-relative plugin root")
          widget.close()
          print(f"python={sys.version.split()[0]} openssl={ssl.OPENSSL_VERSION} qt={QtCore.qVersion()}")
          '@
          $pythonProbePath = Join-Path $extractRoot "portable-runtime-probe.py"
          $pythonProbe | Set-Content -LiteralPath $pythonProbePath -Encoding utf8
          $env:QT_QPA_PLATFORM = "offscreen"
          $pythonEvidence = @(& $packagedPython -I $pythonProbePath 2>&1)
          $pythonEvidence | Set-Content -Encoding utf8 logs/windows-portable-python-qt-ssl.log
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Python/OpenSSL/Qt probe failed with exit code $LASTEXITCODE."
          }

          $portableOutput = Join-Path $extractRoot "acceptance-output"
          $portableProfile = Join-Path $extractRoot "acceptance-profile"
          New-Item -ItemType Directory -Force $portableOutput, $portableProfile | Out-Null
          $env:OPENFUSION_ACCEPTANCE_OUTPUT_DIR = $portableOutput
          $portableApplicationLog = Join-Path $portableOutput "OpenFusionPortableGui.log"
          & $packagedGui `
            --safe-mode `
            --user-cfg (Join-Path $portableProfile "user.cfg") `
            --system-cfg (Join-Path $portableProfile "system.cfg") `
            --log-file $portableApplicationLog `
            --python-path (Join-Path $PWD "tests/acceptance") `
            --run-test OpenFusionPortableWindowsAcceptance `
            2>&1 | Tee-Object -FilePath logs/windows-portable-gui-acceptance.log
          $portableGuiExitCode = $LASTEXITCODE
          if ($portableGuiExitCode -ne 0) {
            throw "Extracted OpenFusion GUI acceptance failed with exit code $portableGuiExitCode."
          }
          foreach ($requiredOutput in @(
            $portableApplicationLog,
            (Join-Path $portableOutput "OpenFusionPortableWindowsAcceptance.json"),
            (Join-Path $portableOutput "OpenFusionPortableRoundTrip.FCStd")
          )) {
            if (-not (Test-Path -LiteralPath $requiredOutput -PathType Leaf) -or
                (Get-Item -LiteralPath $requiredOutput).Length -eq 0) {
              throw "Portable acceptance output is missing or empty: $requiredOutput"
            }
          }
          & $packagedPython .github/scripts/validate_unittest_summary.py `
            logs/windows-portable-gui-acceptance.log `
            --expected-count 1 `
            --label "Windows portable GUI"
          if ($LASTEXITCODE -ne 0) {
            throw "Portable GUI unittest summary validation failed."
          }

          $env:QT_QPA_PLATFORM = $null
          $desktopOutput = Join-Path $extractRoot "desktop-opengl-output"
          $desktopProfile = Join-Path $extractRoot "desktop-opengl-profile"
          New-Item -ItemType Directory -Force $desktopOutput, $desktopProfile | Out-Null
          $renderer = Join-Path $packageRoot "bin/opengl32.dll"
          $env:OPENFUSION_STAGED_OPENGL_PATH = $renderer
          $env:OPENFUSION_STAGED_OPENGL_SHA256 = `
            (Get-FileHash -Algorithm SHA256 $renderer).Hash.ToLowerInvariant()
          $env:OPENFUSION_STAGED_OPENGL_PACKAGE = "authenticated locked qt6-main archive"
          $env:OPENFUSION_ACCEPTANCE_OUTPUT_DIR = $desktopOutput
          $desktopApplicationLog = Join-Path $desktopOutput "OpenFusionPortableDesktop.log"
          & $packagedGui `
            --safe-mode `
            --user-cfg (Join-Path $desktopProfile "user.cfg") `
            --system-cfg (Join-Path $desktopProfile "system.cfg") `
            --log-file $desktopApplicationLog `
            --python-path (Join-Path $PWD "tests/acceptance") `
            --run-test OpenFusionWindowsOpenGLAcceptance `
            2>&1 | Tee-Object -FilePath logs/windows-portable-desktop-opengl.log
          $desktopExitCode = $LASTEXITCODE
          if ($desktopExitCode -ne 0) {
            throw "Portable qwindows/OpenGL acceptance failed with exit code $desktopExitCode."
          }
          $desktopEvidence = Join-Path $desktopOutput "WindowsOpenGLRuntime.json"
          foreach ($requiredOutput in @($desktopApplicationLog, $desktopEvidence)) {
            if (-not (Test-Path -LiteralPath $requiredOutput -PathType Leaf) -or
                (Get-Item -LiteralPath $requiredOutput).Length -eq 0) {
              throw "Portable desktop/OpenGL evidence is missing: $requiredOutput"
            }
          }
          & $packagedPython .github/scripts/validate_unittest_summary.py `
            logs/windows-portable-desktop-opengl.log `
            --expected-count 1 `
            --label "Windows portable qwindows/OpenGL"
          if ($LASTEXITCODE -ne 0) {
            throw "Portable qwindows/OpenGL summary validation failed."
          }

      - name: Upload unsigned Windows portable package
        timeout-minutes: 20
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: OpenFusion-Windows-x86_64-portable-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/windows/OpenFusion-*-Windows-x86_64-unsigned.zip
            artifacts/windows/OpenFusion-*-Windows-x86_64-unsigned.zip.manifest.json
            artifacts/windows/OpenFusion-*-Windows-x86_64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record baseline diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force logs | Out-Null
          @(
            "commit=$(git rev-parse HEAD 2>$null)",
            "runner_os=$env:RUNNER_OS",
            "runner_arch=$env:RUNNER_ARCH",
            "image_os=$env:ImageOS",
            "image_version=$env:ImageVersion",
            "os_version=$([Environment]::OSVersion.VersionString)",
            "workflow_run=$env:GITHUB_RUN_ID",
            "workflow_attempt=$env:GITHUB_RUN_ATTEMPT"
          ) | Set-Content -Encoding utf8 logs/baseline-metadata.txt

          if (Test-Path build/release/CMakeCache.txt) {
            Copy-Item build/release/CMakeCache.txt logs/CMakeCache.txt
          }
          if (Test-Path build/release/CMakeFiles/CMakeConfigureLog.yaml) {
            Copy-Item build/release/CMakeFiles/CMakeConfigureLog.yaml logs/CMakeConfigureLog.yaml
          }
          if (Test-Path build/release/Testing/Temporary) {
            Copy-Item -Recurse build/release/Testing/Temporary logs/ctest-temporary
          }
          if (
            Test-Path -LiteralPath build/release/Testing/OpenFusionAcceptance `
              -PathType Container
          ) {
            Copy-Item -LiteralPath build/release/Testing/OpenFusionAcceptance `
              -Destination logs/openfusion-acceptance -Recurse -ErrorAction Stop
          }

      - name: Upload Windows baseline logs
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: baseline-windows-x64-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
