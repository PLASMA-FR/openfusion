name: Security analysis

"on":
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: "17 04 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locked-dependency-audit:
    name: Locked dependency integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test dependency lock auditor
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            --start-directory .github/scripts/tests \
            --pattern 'test_audit_pixi_lock.py' \
            --verbose

      - name: Audit lock and generate source dependency inventory
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/openfusion-dependency-audit
        run: |
          set -euo pipefail
          install -d -m 0700 "$AUDIT_OUTPUT"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 .github/scripts/audit_pixi_lock.py \
            --lock pixi.lock \
            --spdx-out "$AUDIT_OUTPUT/openfusion-pixi-lock.spdx.json" \
            --report-out "$AUDIT_OUTPUT/pixi-lock-audit.json"
          python3 -m json.tool "$AUDIT_OUTPUT/openfusion-pixi-lock.spdx.json" >/dev/null
          python3 -m json.tool "$AUDIT_OUTPUT/pixi-lock-audit.json" >/dev/null

      - name: Upload audited source dependency inventory
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pixi-lock-security-${{ github.sha }}
          path: ${{ runner.temp }}/openfusion-dependency-audit
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - c-cpp
          - python

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
