# SPDX-License-Identifier: LGPL-2.1-or-later

name: Linux packaging policy

"on":
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  # This release-policy gate intentionally has no path filter. Packaging behavior and
  # release truth also depend on the locked toolchain, legal guards/notices, workflow
  # composition, and installed payload inputs outside packaging/linux.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: linux-packaging-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tarball:
    name: Deterministic tarball policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require packaging toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          command -v zstd
          zstd --version
          command -v openssl
          openssl version

      - name: Run deterministic tarball and legal quarantine policy suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.openfusion.test_linux_tarball
