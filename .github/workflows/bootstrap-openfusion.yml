name: Bootstrap OpenFusion from pinned FreeCAD upstream

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-openfusion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openfusion-upstream-bootstrap
  cancel-in-progress: false

jobs:
  import-upstream:
    if: github.repository == 'PLASMA-FR/openfusion'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UPSTREAM_REPOSITORY: https://github.com/FreeCAD/FreeCAD.git
      UPSTREAM_TAG: 1.1.3
      UPSTREAM_COMMIT: 145529fe741292ff0b3977a01195bf0247425794
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Detect completed import
        id: state
        shell: bash
        run: |
          if [[ -f .openfusion/upstream.json ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the verified upstream history and tree
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_commit="$(git rev-parse HEAD)"
          git remote add freecad-upstream "$UPSTREAM_REPOSITORY"
          git fetch --filter=blob:none freecad-upstream \
            "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"

          resolved_commit="$(git rev-list -n 1 "refs/tags/${UPSTREAM_TAG}")"
          if [[ "$resolved_commit" != "$UPSTREAM_COMMIT" ]]; then
            echo "Upstream verification failed: expected $UPSTREAM_COMMIT, got $resolved_commit" >&2
            exit 1
          fi

          git switch --detach "$UPSTREAM_COMMIT"
          git switch -C openfusion-import
          git checkout "$bootstrap_commit" -- .github/workflows/bootstrap-openfusion.yml

          mkdir -p .openfusion
          printf '%s\n' \
            '{' \
            '  "project": "OpenFusion",' \
            '  "upstream_repository": "https://github.com/FreeCAD/FreeCAD",' \
            '  "upstream_tag": "1.1.3",' \
            '  "upstream_commit": "145529fe741292ff0b3977a01195bf0247425794",' \
            '  "import_strategy": "history-preserving fast-forward merge"' \
            '}' > .openfusion/upstream.json

          git config user.name "OpenFusion Automation"
          git config user.email "openfusion-automation@users.noreply.github.com"
          git add .github/workflows/bootstrap-openfusion.yml .openfusion/upstream.json
          git commit -m "chore(upstream): establish FreeCAD 1.1.3 baseline"

          git merge --no-ff --allow-unrelated-histories --strategy=ours \
            "$bootstrap_commit" \
            -m "chore(repo): retain authenticated bootstrap history"

          git push origin HEAD:main

      - name: Report existing baseline
        if: steps.state.outputs.complete == 'true'
        run: echo "Pinned FreeCAD baseline already imported."
