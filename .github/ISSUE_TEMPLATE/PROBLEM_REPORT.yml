name: Report a Problem
description: Have you found something that does not work well, is too hard to do or is missing altogether? Please create a Problem Report.
labels: ["Status: Needs triage","Status: Needs confirmation"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must not be reported in a public issue. Follow
        [SECURITY.md](https://github.com/PLASMA-FR/openfusion/security/policy) and use a
        [private security advisory](https://github.com/PLASMA-FR/openfusion/security/advisories/new).
  - type: checkboxes
    id: existing_issue
    attributes:
      label: Is there an existing issue for this?
      description: Please [search OpenFusion issues](https://github.com/PLASMA-FR/openfusion/issues) to see if a similar report already exists.
      options:
      - label: I have searched the existing issues
        required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe the problem and how it impacts user experience, workflow, maintainability or speed of the code. If the problem appears to be a bug with the current functionality, provide as test case or recipe that reproduces the error. Ideally record a macro and attach it.
      placeholder: Description of the problem
    validations:
      required: true
  - type: textarea
    id: full_version
    attributes:
      label: Full version info
      description: Use Help > About > Copy to Clipboard and paste the full version information here. If practical, also try reproducing the issue after restarting in safe mode.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: wb
    attributes:
      label: Subproject(s) affected?
      options:
        - Addon Manager
        - Assembly
        - BIM
        - CAM
        - Core
        - Draft
        - Expressions
        - FEM
        - File formats
        - Material
        - Measurement
        - Mesh
        - OpenSCAD
        - Part
        - PartDesign
        - Project Tools & Websites
        - Sketcher
        - Spreadsheet
        - TechDraw
        - Other (specify in description)
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!
        Include links to related OpenFusion issues, pull requests, or design discussions.
        You can upload or copy your macro here to speed up the diagnosis and debugging.

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in. To attach a FCStd file, ZIP it first (GitHub won't recognize the extension otherwise).
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [OpenFusion Code of Conduct](https://github.com/PLASMA-FR/openfusion/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
